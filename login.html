<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SARI - Login</title>
  
  <link rel="stylesheet" href="css/style.css?v=21.0">
  <link rel="stylesheet" href="css/login.css?v=22.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="login-page">

  <div class="login-split-container">

    <!-- LEFT BRAND BANNER -->
    <div class="login-left-banner brand-section">
      <div class="banner-content-box brand-content">

        <div class="banner-center-brand brand-logo">
          <div class="banner-logo-wrap logo-symbol">
            <img src="assets/sari-logo.jpg" alt="SARI Logo" class="banner-logo-img">
          </div>
          <h1 class="banner-brand-name">SARI</h1>
          <div class="banner-brand-subline">
            <span class="line-deco"></span>
            <span class="subline-text">SMART TINDAHAN</span>
            <span class="line-deco"></span>
          </div>
        </div>

        <!-- TAGLINE SA GITNA -->
        <p class="banner-cursive-tagline">
          Welcome back — your smart tindahan is waiting
        </p>
        
        <!-- 4 CORE POS FEATURE ICONS -->
        <div class="features-row-minimal features">
          <div class="feature-item-min feature">
            <div class="feat-icon-circle feature-icon">
              <i class="fa-solid fa-cash-register"></i>
            </div>
            <span>POS Checkout</span>
          </div>

          <div class="feature-item-min feature">
            <div class="feat-icon-circle feature-icon">
              <i class="fa-solid fa-boxes-stacked"></i>
            </div>
            <span>Realtime Inventory</span>
          </div>

          <div class="feature-item-min feature">
            <div class="feat-icon-circle feature-icon">
              <i class="fa-solid fa-book-bookmark"></i>
            </div>
            <span>Credit Ledger</span>
          </div>

          <div class="feature-item-min feature">
            <div class="feat-icon-circle feature-icon">
              <i class="fa-solid fa-chart-line"></i>
            </div>
            <span>Sales Analytics</span>
          </div>
        </div>

      </div>
    </div>

    <!-- RIGHT LOGIN FORM -->
    <div class="login-right-section form-section">
      <div class="form-wrapper login-card">

        <div class="card-logo-top mobile-logo">
          <div class="card-logo-wrap mobile-logo-icon">
            <img src="assets/sari-logo.jpg" alt="SARI Logo" class="card-logo-img">
          </div>
          <h2>SARI <span>STORE</span></h2>
        </div>

        <div class="login-header">
          <h2 class="welcome-title">Welcome back!</h2>
          <p class="subtitle">Log in to manage your store.</p>
        </div>

        <div id="errorBox" class="error-message" role="alert" style="display:none;"></div>

        <form id="loginForm">
          <div class="input-group">
            <label for="loginEmail">Email Address</label>
            <div class="input-field-box input-wrapper">
              <i class="fa-solid fa-envelope field-icon"></i>
              <input type="email" id="loginEmail" name="email" placeholder="owner@example.com" autocomplete="email" required>
            </div>
          </div>

          <div class="input-group">
            <label for="loginPassword">Password</label>
            <div class="input-field-box input-wrapper">
              <i class="fa-solid fa-lock field-icon"></i>
              <input type="password" id="loginPassword" name="password" placeholder="Enter your password" autocomplete="current-password" required>
              <button type="button" class="toggle-eye password-toggle" id="togglePassword" aria-label="Show password">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="forgot-wrapper forgot-row">
            <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
          </div>

          <button type="submit" id="btnLogin" class="btn-login login-button">
            <i class="fa-solid fa-arrow-right"></i>
            <span>Log In</span>
          </button>
        </form>

        <p class="signup-text">
          Don't have an account? <a href="signup.html">Sign Up</a>
        </p>

      </div>
    </div>

  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
