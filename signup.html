<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#164a41">
  <title>SARI - Sign Up</title>
  
  <!-- Gamitin ang parehong CSS style setup tulad ng sa login.html -->
  <link rel="stylesheet" href="css/style.css?v=22.0">
  <link rel="stylesheet" href="css/login.css?v=30.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="login-page">

  <div class="login-split-container signup-active">

    <!-- LEFT BRAND BANNER -->
    <div class="login-left-banner brand-section">
      <div class="banner-content-box brand-content">

        <div class="banner-center-brand brand-logo">
          <div class="banner-logo-wrap logo-symbol">
            <img src="assets/sari-logo.jpg" alt="SARI Logo" class="banner-logo-img">
          </div>
          <h1 class="banner-brand-name">SARI</h1>
          <div class="banner-brand-subline">
            <span class="line-deco"></span>
            <span class="subline-text">SMART TINDAHAN</span>
            <span class="line-deco"></span>
          </div>
        </div>

        <!-- BAGO AT ANGKOP NA SIGN UP TAGLINE -->
        <p class="banner-cursive-tagline">
          "Ready to grow your store? Let’s get started with SARI!"
        </p>

        <!-- 4 CORE POS FEATURE ICONS -->
        <div class="features-row-minimal features">
          <div class="feature-item-min feature">
            <div class="feat-icon-circle feature-icon">
              <i class="fa-solid fa-cash-register"></i>
            </div>
            <span>POS Checkout</span>
          </div>

          <div class="feature-item-min feature">
            <div class="feat-icon-circle feature-icon">
              <i class="fa-solid fa-boxes-stacked"></i>
            </div>
            <span>Realtime Inventory</span>
          </div>

          <div class="feature-item-min feature">
            <div class="feat-icon-circle feature-icon">
              <i class="fa-solid fa-book-bookmark"></i>
            </div>
            <span>Credit Ledger</span>
          </div>

          <div class="feature-item-min feature">
            <div class="feat-icon-circle feature-icon">
              <i class="fa-solid fa-chart-line"></i>
            </div>
            <span>Sales Analytics</span>
          </div>
        </div>

      </div>
    </div>

    <!-- RIGHT SIGNUP FORM -->
    <div class="login-right-section form-section">
      <div class="form-wrapper login-card">

        <div class="card-logo-top mobile-logo">
          <div class="card-logo-wrap mobile-logo-icon">
            <img src="assets/sari-logo.jpg" alt="SARI Logo" class="card-logo-img">
          </div>
          <h2>SARI <span>STORE</span></h2>
        </div>

        <div class="login-header">
          <h2 class="welcome-title">Create Account</h2>
          <p class="subtitle">Sign up to start managing your store.</p>
        </div>

        <div id="errorBox" class="error-message" role="alert" aria-live="polite" style="display:none;"></div>

        <form id="signupForm">
          <div class="input-group">
            <label for="signupName">Store / Owner Name</label>
            <div class="input-field-box input-wrapper">
              <i class="fa-solid fa-user field-icon" aria-hidden="true"></i>
              <input type="text" id="signupName" name="signupName" placeholder="Juan Dela Cruz" autocomplete="name" required>
            </div>
          </div>

          <div class="input-group">
            <label for="signupEmail">Email Address</label>
            <div class="input-field-box input-wrapper">
              <i class="fa-solid fa-envelope field-icon" aria-hidden="true"></i>
              <input type="email" id="signupEmail" name="signupEmail" placeholder="owner@example.com" autocomplete="email" required>
            </div>
          </div>

          <div class="input-group">
            <label for="signupPassword">Password</label>
            <div class="input-field-box input-wrapper password-wrapper">
              <i class="fa-solid fa-lock field-icon" aria-hidden="true"></i>
              <input type="password" id="signupPassword" name="signupPassword" placeholder="Create a password" autocomplete="new-password" required>
              <button type="button" class="toggle-eye password-toggle" id="toggleSignupPassword" aria-label="Show password" aria-pressed="false">
                <i class="fa-solid fa-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <button type="submit" id="btnSignup" class="btn-login login-button">
            <i class="fa-solid fa-user-plus" aria-hidden="true"></i>
            <span>Sign Up</span>
          </button>
        </form>

        <p class="signup-text">
          Already have an account? <a href="login.html">Log in</a>
        </p>

      </div>
    </div>

  </div>

  <script type="module" src="js/signup.js"></script>
</body>
</html>
