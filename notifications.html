<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SARI - Notifications & Stock Status</title>

  <link rel="stylesheet" href="css/style.css?v=14.0">
  <link rel="stylesheet" href="css/extra.css?v=14.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    .notif-page {
      width: 100%;
      min-height: calc(100vh - 100px);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 15px 20px 30px;
      box-sizing: border-box;
    }

    .notif-card-container {
      width: 100%;
      max-width: 680px;
      background-color: #1b3b32;
      border: 2px solid #9DC88D;
      border-radius: 20px;
      padding: 22px 25px;
      margin: 0 auto;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
      color: #ffffff;
      box-sizing: border-box;
    }

    .notif-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
    }

    .notif-header-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #9DC88D;
      color: #164A41;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .notif-header h2 {
      margin: 0;
      font-size: 1.15rem;
      color: #ffffff;
      font-weight: 800;
    }

    .notif-header p {
      margin: 2px 0 0;
      color: #cbd5e1;
      font-size: 0.75rem;
    }

    .notif-summary {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .notif-summary-item {
      padding: 5px 9px;
      border-radius: 7px;
      font-size: 0.68rem;
      font-weight: 700;
    }

    .notif-summary-inventory {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
    }

    .notif-summary-transactions {
      background: rgba(96, 165, 250, 0.15);
      color: #60a5fa;
    }

    .notif-summary-credit {
      background: rgba(249, 115, 22, 0.15);
      color: #fb923c;
    }

    #notificationsContainer {
      width: 100%;
    }

    .notif-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .notif-item-icon {
      width: 36px;
      height: 36px;
      min-width: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .notif-item-content {
      flex: 1;
      min-width: 0;
    }

    .notif-item-content h4 {
      margin: 0 0 3px;
      color: #ffffff;
      font-size: 0.88rem;
      font-weight: 700;
    }

    .notif-item-content p {
      margin: 0;
      color: #cbd5e1;
      font-size: 0.76rem;
      line-height: 1.4;
    }

    .notif-item-time {
      color: #9DC88D;
      font-size: 0.68rem;
      white-space: nowrap;
    }

    .notif-empty, .notif-loading, .notif-error {
      text-align: center;
      color: #cbd5e1;
      padding: 30px 15px;
      font-size: 0.82rem;
    }

    .notif-error {
      color: #f87171;
    }

    .notif-section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .notif-section-title strong {
      color: #ffffff;
      font-size: 0.82rem;
    }

    .notif-count {
      background: rgba(157, 200, 141, 0.15);
      color: #9DC88D;
      padding: 4px 8px;
      border-radius: 7px;
      font-size: 0.65rem;
      font-weight: 700;
    }

    #topbarAvatarContainer {
      width: 32px !important;
      height: 32px !important;
      min-width: 32px !important;
      min-height: 32px !important;
      border-radius: 50% !important;
      background-color: #ffffff !important;
      color: #1b382b !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      font-weight: 800 !important;
      font-size: 0.9rem !important;
      overflow: hidden !important;
      position: relative !important;
      flex-shrink: 0 !important;
      line-height: 1 !important;
    }

    #topbarStoreName {
      color: #ffffff !important;
      font-weight: 700 !important;
      font-size: 0.95rem !important;
    }

    @media (max-width: 768px) {
      .notif-page {
        padding: 10px;
      }
      .notif-card-container {
        max-width: 100%;
        padding: 18px;
      }
      .notif-item-time {
        display: none;
      }
    }
  </style>
</head>
<body class="app-page">

  <div class="app-shell">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
  <a href="homepage.html" class="sidebar-logo">
    <img src="assets/sari-logo.jpg" alt="Sari Logo" class="sidebar-logo-img">
    <span>Sari</span>
  </a>
</div>

      <nav class="sidebar-nav">
        <a href="homepage.html" class="sidebar-link">
          <span class="sidebar-icon"><i class="fa-solid fa-house"></i></span>
          <span class="sidebar-label">Home</span>
        </a>
        <a href="inventory.html" class="sidebar-link">
          <span class="sidebar-icon"><i class="fa-solid fa-box"></i></span>
          <span class="sidebar-label">Inventory</span>
        </a>
        <a href="checkout.html" class="sidebar-link">
          <span class="sidebar-icon"><i class="fa-solid fa-cash-register"></i></span>
          <span class="sidebar-label">Checkout</span>
        </a>
        <a href="dashboard.html" class="sidebar-link">
          <span class="sidebar-icon"><i class="fa-solid fa-chart-pie"></i></span>
          <span class="sidebar-label">Dashboard</span>
        </a>
        <a href="credit-ledger.html" class="sidebar-link">
          <span class="sidebar-icon"><i class="fa-solid fa-money-check-dollar"></i></span>
          <span class="sidebar-label">Credit Ledger</span>
        </a>
        <a href="transactions.html" class="sidebar-link">
          <span class="sidebar-icon"><i class="fa-solid fa-receipt"></i></span>
          <span class="sidebar-label">Transactions</span>
        </a>
        <a href="settings.html" class="sidebar-link">
          <span class="sidebar-icon"><i class="fa-solid fa-gear"></i></span>
          <span class="sidebar-label">Settings</span>
        </a>
        <a href="profile.html" class="sidebar-link">
          <span class="sidebar-icon"><i class="fa-solid fa-user"></i></span>
          <span class="sidebar-label">My Profile</span>
        </a>
      </nav>

      <div class="sidebar-spacer"></div>

      <button id="logoutBtn" class="sidebar-logout" style="background:none; border:none; cursor:pointer; width:100%; text-align:left; color:inherit;">
        <span class="sidebar-icon"><i class="fa-solid fa-arrow-right-from-bracket"></i></span>
        <span class="sidebar-label">Log Out</span>
      </button>
    </aside>

    <main class="main-content">

      <div class="topbar-row">
        <div class="topbar">
          <div class="topbar-left">
            <button class="topbar-home-btn" type="button">Notifications & Stock Status</button>
          </div>

          <a class="topbar-store" id="profileBtn" href="profile.html" style="text-decoration:none; color:inherit; display:flex; align-items:center; gap:10px;">
            <span class="topbar-avatar" id="topbarAvatarContainer"></span>
            <span id="topbarStoreName">Loading...</span>
          </a>
        </div>
      </div>

      <div class="notif-page">
        <div class="notif-card-container">

          <div class="notif-header">
            <div class="notif-header-icon">
              <i class="fa-solid fa-bell"></i>
            </div>
            <div>
              <h2>Stock Status & Alerts</h2>
              <p>Inventory, transactions, and credit notifications.</p>
            </div>
          </div>

          <div id="notificationSummary" class="notif-summary"></div>

          <div id="notificationsContainer">
            <div class="notif-loading">
              <i class="fa-solid fa-spinner fa-spin" style="font-size:22px; color:#9DC88D; margin-bottom:10px;"></i>
              <br>
              Connecting to SARI database...
            </div>
          </div>

        </div>
      </div>

    </main>
  </div>

  <script src="js/script.js?v=14.0" type="module"></script>
  <script src="js/notification.js?v=2" type="module"></script>
</body>
</html>
